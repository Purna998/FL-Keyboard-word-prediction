<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FL Keyboard</title>
<style>
  :root {
    --bg: #0f1115; --panel: #181b22; --key: #2a2f3a; --key-hi: #3a4150;
    --accent: #4ade80; --blue: #60a5fa; --text: #e8eaed; --muted: #8b93a1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; justify-content: center;
    background: var(--bg); color: var(--text); font-family: system-ui, sans-serif;
  }
  .layout {
    display: grid; grid-template-columns: 420px 1fr; gap: 24px;
    align-items: start; max-width: 1100px; width: 100%; padding: 24px 16px;
  }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  h2 { margin: 0; font-size: 15px; font-weight: 600; }
  header { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #555; margin-right: 6px; }
  .dot.ok { background: var(--accent); } .dot.bad { background: #f87171; }

  .seg { display: grid; grid-template-columns: 1fr 1fr; background: #0b0d11; border-radius: 10px; padding: 3px; }
  .seg button {
    border: 0; background: transparent; color: var(--muted); padding: 8px; border-radius: 8px;
    font-size: 13px; cursor: pointer;
  }
  .seg button.active { background: var(--key); color: var(--text); }

  #screen {
    min-height: 120px; background: #0b0d11; border-radius: 12px; padding: 14px;
    font-size: 20px; line-height: 1.4; word-break: break-word; white-space: pre-wrap;
  }
  .caret { display: inline-block; width: 2px; height: 1.1em; background: var(--accent); vertical-align: text-bottom; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #suggestions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .sug { min-height: 42px; padding: 10px 4px; background: var(--key); color: var(--text); border: 0; border-radius: 8px; font-size: 16px; cursor: pointer; }
  .sug:hover:not(:disabled) { background: var(--key-hi); }
  .sug:disabled { opacity: 0.35; cursor: default; }
  .row { display: flex; justify-content: center; gap: 5px; }
  .key { flex: 1; max-width: 38px; height: 46px; background: var(--key); color: var(--text); border: 0; border-radius: 8px; font-size: 18px; cursor: pointer; }
  .key:active { background: var(--key-hi); }
  .key.wide { max-width: none; flex: 1.6; } .key.space { max-width: none; flex: 5; }
  #meta { font-size: 12px; color: var(--muted); text-align: right; min-height: 16px; }

  .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
  input[type=number] { background: #0b0d11; border: 1px solid var(--key); color: var(--text); border-radius: 8px; padding: 8px; font-size: 14px; width: 100%; }
  .btns { display: flex; gap: 8px; align-items: center; }
  .btn { border: 0; border-radius: 8px; padding: 10px 16px; font-size: 14px; cursor: pointer; background: var(--accent); color: #062b14; font-weight: 600; }
  .btn.sec { background: var(--key); color: var(--text); font-weight: 500; }
  .btn:disabled { opacity: 0.4; cursor: default; }
  #fl-status { font-size: 13px; color: var(--muted); }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { background: #0b0d11; border-radius: 12px; padding: 12px; }
  .stat .v { font-size: 22px; font-weight: 600; }
  .stat .l { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: right; padding: 5px 8px; border-bottom: 1px solid var(--key); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; }
</style>
</head>
<body>
<div class="layout">

  <!-- LEFT: phone -->
  <div class="card">
    <header>
      <span><span id="dot" class="dot"></span><span id="status">connecting...</span></span>
      <span id="model-label"></span>
    </header>
    <div class="seg">
      <button id="btn-baseline" class="active">Centralized baseline</button>
      <button id="btn-federated">Federated model</button>
    </div>
    <div id="screen"></div>
    <div id="suggestions"></div>
    <div id="keys"></div>
    <div id="meta"></div>
  </div>

  <!-- RIGHT: federated dashboard -->
  <div class="card">
    <h2>Federated training</h2>
    <div class="controls">
      <label>Rounds<input id="in-rounds" type="number" min="1" max="200" value="10"></label>
      <label>Clients / round<input id="in-clients" type="number" min="1" max="12" value="6"></label>
      <label>Local epochs<input id="in-epochs" type="number" min="1" max="5" value="2"></label>
    </div>
    <div class="btns">
      <button id="btn-start" class="btn">Run rounds</button>
      <button id="btn-reset" class="btn sec">Reset federated model</button>
      <span id="fl-status"></span>
    </div>

    <div class="stats">
      <div class="stat"><div class="v" id="s-round">0</div><div class="l">federated rounds done</div></div>
      <div class="stat"><div class="v" id="s-fed">-</div><div class="l">federated top-3 accuracy</div></div>
      <div class="stat"><div class="v" id="s-base">-</div><div class="l">centralized top-3 accuracy</div></div>
    </div>

    <div class="legend">
      <span><i style="border-color:var(--blue)"></i>federated (per round)</span>
      <span><i style="border-color:var(--accent);border-top-style:dashed"></i>centralized baseline</span>
      <span><i style="border-color:#8b93a1;border-top-style:dashed"></i>always suggest the 3 most common words</span>
    </div>
    <div id="chart"></div>

    <h2>Recent rounds</h2>
    <table>
      <thead><tr><th>Round</th><th>Top-1</th><th>Top-3</th><th>Perplexity</th><th>Train loss</th><th>Seconds</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script>
const API = "http://localhost:8000";
let text = "", reqId = 0, which = "baseline";
let refs = null;          // reference numbers from /evaluate
let lastRound = -1;
let history = [];

const $ = (id) => document.getElementById(id);
const pct = (v) => (v == null ? "-" : (v * 100).toFixed(1) + "%");

/* ---------------- phone ---------------- */
function render() {
  $("screen").textContent = text;
  const c = document.createElement("span");
  c.className = "caret";
  $("screen").appendChild(c);
}
function showSuggestions(words) {
  const el = $("suggestions");
  el.innerHTML = "";
  for (let i = 0; i < 3; i++) {
    const b = document.createElement("button");
    b.className = "sug";
    b.textContent = words[i] || "";
    b.disabled = !words[i];
    if (words[i]) b.onclick = () => accept(words[i]);
    el.appendChild(b);
  }
}
function press(ch) { text += ch; refresh(); }
function backspace() { text = text.slice(0, -1); refresh(); }
function accept(word) {
  const i = text.lastIndexOf(" ");
  text = text.slice(0, i + 1) + word + " ";
  refresh();
}
function refresh() { render(); updateSuggestions(); }

async function updateSuggestions() {
  const id = ++reqId;
  const i = text.lastIndexOf(" ");
  const context = text.slice(0, i + 1);
  const partial = text.slice(i + 1).toLowerCase();
  const k = partial ? 50 : 3;
  const t0 = performance.now();
  try {
    const r = await fetch(`${API}/predict`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: context, k, which }),
    });
    const data = await r.json();
    if (id !== reqId) return;
    let words = data.suggestions;
    if (partial) words = words.filter((w) => w.startsWith(partial));
    showSuggestions(words.slice(0, 3));
    $("meta").textContent = `${Math.round(performance.now() - t0)} ms`;
  } catch (e) {
    if (id !== reqId) return;
    showSuggestions([]);
    $("meta").textContent = "backend unreachable";
  }
}

function makeKey(label, onClick, cls = "") {
  const b = document.createElement("button");
  b.className = "key " + cls;
  b.textContent = label;
  b.onclick = onClick;
  return b;
}
function buildKeyboard() {
  const keys = $("keys");
  keys.style.cssText = "display:flex;flex-direction:column;gap:6px";
  ["qwertyuiop", "asdfghjkl", "zxcvbnm"].forEach((letters, idx) => {
    const row = document.createElement("div");
    row.className = "row";
    for (const ch of letters) row.appendChild(makeKey(ch, () => press(ch)));
    if (idx === 2) row.appendChild(makeKey("⌫", backspace, "wide"));
    keys.appendChild(row);
  });
  const bottom = document.createElement("div");
  bottom.className = "row";
  bottom.appendChild(makeKey("'", () => press("'")));
  bottom.appendChild(makeKey("space", () => press(" "), "space"));
  bottom.appendChild(makeKey("clear", () => { text = ""; refresh(); }, "wide"));
  keys.appendChild(bottom);
}
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;   // don't hijack the number boxes
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "Backspace") { e.preventDefault(); backspace(); }
  else if (e.key === " ") { e.preventDefault(); press(" "); }
  else if (/^[a-zA-Z']$/.test(e.key)) { press(e.key.toLowerCase()); }
});

function setModel(w) {
  which = w;
  $("btn-baseline").classList.toggle("active", w === "baseline");
  $("btn-federated").classList.toggle("active", w === "federated");
  updateLabel();
  updateSuggestions();
}
function updateLabel() {
  const r = history.length ? history[history.length - 1].round : 0;
  $("model-label").textContent =
    which === "federated" ? `federated, round ${r}` : "centralized baseline";
}
$("btn-baseline").onclick = () => setModel("baseline");
$("btn-federated").onclick = () => setModel("federated");

/* ---------------- federated dashboard ---------------- */
function drawChart() {
  const W = 560, H = 240, L = 44, R = 14, T = 12, B = 30;
  const pts = history.map((h) => ({ x: h.round, y: h.top3 }));
  const maxX = Math.max(5, ...pts.map((p) => p.x));
  const base = refs ? refs.base.top3 : 0;
  const freq = refs ? refs.freq.top3 : 0;
  const maxY = Math.max(0.35, base, ...pts.map((p) => p.y)) * 1.1;
  const sx = (x) => L + (x / maxX) * (W - L - R);
  const sy = (y) => H - B - (y / maxY) * (H - T - B);

  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">`;
  for (let i = 0; i <= 4; i++) {
    const v = (maxY * i) / 4, y = sy(v);
    s += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="#2a2f3a"/>`;
    s += `<text x="${L - 6}" y="${y + 4}" text-anchor="end" fill="#8b93a1" font-size="11">${(v * 100).toFixed(0)}%</text>`;
  }
  const step = Math.max(1, Math.ceil(maxX / 6));
  for (let x = 0; x <= maxX; x += step) {
    s += `<text x="${sx(x)}" y="${H - 10}" text-anchor="middle" fill="#8b93a1" font-size="11">${x}</text>`;
  }
  s += `<text x="${(L + W - R) / 2}" y="${H - 0}" text-anchor="middle" fill="#8b93a1" font-size="10">federated round</text>`;
  if (refs) {
    s += `<line x1="${L}" x2="${W - R}" y1="${sy(base)}" y2="${sy(base)}" stroke="#4ade80" stroke-dasharray="6 4"/>`;
    s += `<line x1="${L}" x2="${W - R}" y1="${sy(freq)}" y2="${sy(freq)}" stroke="#8b93a1" stroke-dasharray="3 4"/>`;
  }
  if (pts.length) {
    s += `<polyline fill="none" stroke="#60a5fa" stroke-width="2.5" points="${pts.map((p) => `${sx(p.x)},${sy(p.y)}`).join(" ")}"/>`;
    for (const p of pts) s += `<circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="3" fill="#60a5fa"/>`;
  }
  s += `</svg>`;
  $("chart").innerHTML = s;
}

function renderTable() {
  const tb = $("tbody");
  tb.innerHTML = "";
  for (const h of history.slice(-8).reverse()) {
    const tr = document.createElement("tr");
    const cells = [h.round, pct(h.top1), pct(h.top3), h.perplexity,
                   h.avg_loss == null ? "-" : h.avg_loss, h.seconds];
    for (const c of cells) {
      const td = document.createElement("td");
      td.textContent = c;
      tr.appendChild(td);
    }
    tb.appendChild(tr);
  }
}

async function poll() {
  try {
    const d = await (await fetch(`${API}/fl/status`)).json();
    history = d.history || [];
    const last = history.length ? history[history.length - 1] : null;
    const round = last ? last.round : 0;

    $("s-round").textContent = round;
    $("s-fed").textContent = last ? pct(last.top3) : "-";
    $("s-base").textContent = refs ? pct(refs.base.top3) : "...";
    $("btn-start").disabled = d.running;
    $("btn-reset").disabled = d.running;
    $("fl-status").textContent = d.error
      ? "error: " + d.error
      : d.running ? `training... (round ${round})` : "idle";

    drawChart();
    renderTable();
    updateLabel();
    if (round !== lastRound) {
      lastRound = round;
      if (which === "federated") updateSuggestions();  // model changed
    }
  } catch (e) {
    $("fl-status").textContent = "backend unreachable";
  }
}

$("btn-start").onclick = async () => {
  const body = {
    rounds: +$("in-rounds").value,
    clients_per_round: +$("in-clients").value,
    local_epochs: +$("in-epochs").value,
    lr: 0.005,
  };
  const r = await fetch(`${API}/fl/start`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const d = await r.json();
  $("fl-status").textContent = d.message;
  poll();
};
$("btn-reset").onclick = async () => {
  if (!confirm("Reset the federated model and its history?")) return;
  const d = await (await fetch(`${API}/fl/reset`, { method: "POST" })).json();
  if (d.message) $("fl-status").textContent = d.message;
  lastRound = -1;
  poll();
  if (which === "federated") updateSuggestions();
};

/* ---------------- startup ---------------- */
async function init() {
  buildKeyboard(); render(); showSuggestions([]); updateLabel();
  try {
    const h = await (await fetch(`${API}/health`)).json();
    $("dot").className = "dot ok";
    $("status").textContent = `backend ok (vocab ${h.vocab_size})`;
  } catch (e) {
    $("dot").className = "dot bad";
    $("status").textContent = "backend offline";
  }
  poll();
  updateSuggestions();
  setInterval(poll, 2000);
  // reference numbers (takes a moment: evaluates both models once)
  try {
    const e = await (await fetch(`${API}/evaluate`)).json();
    refs = { base: e.baseline, freq: e.frequency_baseline };
    $("s-base").textContent = pct(refs.base.top3);
    drawChart();
  } catch (e) {}
}
init();
</script>
</body>
</html>
