<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FL Keyboard</title>
<style>
  :root {
    --bg: #0f1115; --panel: #181b22; --key: #2a2f3a; --key-hi: #3a4150;
    --accent: #4ade80; --text: #e8eaed; --muted: #8b93a1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; justify-content: center;
    align-items: center; background: var(--bg); color: var(--text);
    font-family: system-ui, sans-serif;
  }
  .phone {
    width: min(420px, 100vw); background: var(--panel); border-radius: 24px;
    padding: 16px; display: flex; flex-direction: column; gap: 12px;
  }
  header { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #555; margin-right: 6px; }
  .dot.ok { background: var(--accent); }
  .dot.bad { background: #f87171; }
  #screen {
    min-height: 140px; background: #0b0d11; border-radius: 12px; padding: 14px;
    font-size: 20px; line-height: 1.4; word-break: break-word; white-space: pre-wrap;
  }
  .caret {
    display: inline-block; width: 2px; height: 1.1em; background: var(--accent);
    vertical-align: text-bottom; animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  #suggestions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .sug {
    min-height: 42px; padding: 10px 4px; background: var(--key); color: var(--text);
    border: 0; border-radius: 8px; font-size: 16px; cursor: pointer;
  }
  .sug:hover:not(:disabled) { background: var(--key-hi); }
  .sug:disabled { opacity: 0.35; cursor: default; }
  .row { display: flex; justify-content: center; gap: 5px; }
  .key {
    flex: 1; max-width: 38px; height: 46px; background: var(--key); color: var(--text);
    border: 0; border-radius: 8px; font-size: 18px; cursor: pointer;
  }
  .key:active { background: var(--key-hi); }
  .key.wide { max-width: none; flex: 1.6; }
  .key.space { max-width: none; flex: 5; }
  #meta { font-size: 12px; color: var(--muted); text-align: right; min-height: 16px; }
</style>
</head>
<body>
  <div class="phone">
    <header>
      <span><span id="dot" class="dot"></span><span id="status">connecting...</span></span>
      <span id="model">model: centralized baseline</span>
    </header>
    <div id="screen"></div>
    <div id="suggestions"></div>
    <div id="keys"></div>
    <div id="meta"></div>
  </div>

<script>
const API = "http://localhost:8000";
let text = "";
let reqId = 0;

const screenEl = document.getElementById("screen");
const sugEl = document.getElementById("suggestions");
const metaEl = document.getElementById("meta");

// ---------- rendering ----------
function render() {
  screenEl.textContent = text;
  const c = document.createElement("span");
  c.className = "caret";
  screenEl.appendChild(c);
}

function showSuggestions(words) {
  sugEl.innerHTML = "";
  for (let i = 0; i < 3; i++) {
    const b = document.createElement("button");
    b.className = "sug";
    b.textContent = words[i] || "";
    b.disabled = !words[i];
    if (words[i]) b.onclick = () => accept(words[i]);
    sugEl.appendChild(b);
  }
}

// ---------- input ----------
function press(ch) { text += ch; refresh(); }
function backspace() { text = text.slice(0, -1); refresh(); }
function accept(word) {
  const i = text.lastIndexOf(" ");
  text = text.slice(0, i + 1) + word + " ";
  refresh();
}
function refresh() { render(); updateSuggestions(); }

// ---------- prediction ----------
async function updateSuggestions() {
  const id = ++reqId;
  const i = text.lastIndexOf(" ");
  const context = text.slice(0, i + 1);          // everything before the current word
  const partial = text.slice(i + 1).toLowerCase(); // the word being typed
  const k = partial ? 50 : 3;                      // mid-word: fetch more, filter by prefix
  const t0 = performance.now();
  try {
    const r = await fetch(`${API}/predict`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: context, k }),
    });
    const data = await r.json();
    if (id !== reqId) return; // a newer keystroke superseded this one
    let words = data.suggestions;
    if (partial) words = words.filter(w => w.startsWith(partial));
    showSuggestions(words.slice(0, 3));
    metaEl.textContent = `${Math.round(performance.now() - t0)} ms`;
  } catch (e) {
    if (id !== reqId) return;
    showSuggestions([]);
    metaEl.textContent = "backend unreachable";
  }
}

// ---------- on-screen keyboard ----------
function makeKey(label, onClick, cls = "") {
  const b = document.createElement("button");
  b.className = "key " + cls;
  b.textContent = label;
  b.onclick = onClick;
  return b;
}

function buildKeyboard() {
  const keys = document.getElementById("keys");
  keys.style.cssText = "display:flex;flex-direction:column;gap:6px";
  ["qwertyuiop", "asdfghjkl", "zxcvbnm"].forEach((letters, idx) => {
    const row = document.createElement("div");
    row.className = "row";
    for (const ch of letters) row.appendChild(makeKey(ch, () => press(ch)));
    if (idx === 2) row.appendChild(makeKey("⌫", backspace, "wide"));
    keys.appendChild(row);
  });
  const bottom = document.createElement("div");
  bottom.className = "row";
  bottom.appendChild(makeKey("'", () => press("'")));
  bottom.appendChild(makeKey("space", () => press(" "), "space"));
  bottom.appendChild(makeKey("clear", () => { text = ""; refresh(); }, "wide"));
  keys.appendChild(bottom);
}

// physical keyboard
document.addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "Backspace") { e.preventDefault(); backspace(); }
  else if (e.key === " ") { e.preventDefault(); press(" "); }
  else if (/^[a-zA-Z']$/.test(e.key)) { press(e.key.toLowerCase()); }
});

// ---------- startup ----------
async function checkHealth() {
  const dot = document.getElementById("dot");
  const status = document.getElementById("status");
  try {
    const r = await fetch(`${API}/health`);
    const d = await r.json();
    dot.className = "dot ok";
    status.textContent = `backend ok (vocab ${d.vocab_size})`;
  } catch (e) {
    dot.className = "dot bad";
    status.textContent = "backend offline";
  }
}

buildKeyboard();
render();
showSuggestions([]);
checkHealth();
updateSuggestions();
</script>
</body>
</html>
